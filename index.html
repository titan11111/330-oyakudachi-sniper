function lose(ttl,why){if(G.over)return;G.over=true;G.ok=false;G.endT=0;G.ttl=ttl;G.why=why||MS[G.mi].failText||W.failText;sfx.fail();W.onFail&&W.onFail();$('#flash').style.background='#a00';$('#flash').style.opacity=.4;setTimeout(()=>{$('#flash').style.opacity=0;$('#flash').style.background='#fff'},250)}
function result(){G.mode='res';const m=MS[G.mi];let h;
 if(G.ok){const tb=Math.round((1-G.t/G.limit)*600),sb=(G.maxShots-G.shots)*150,pb=G.perfect?250:0,sc=1000+tb+sb+pb,rk=sc>=1650?'S':sc>=1350?'A':sc>=1100?'B':'C';if(!best[m.no]||best[m.no].s<sc){best[m.no]={s:sc,r:rk};try{localStorage.setItem('tg.330.best',JSON.stringify(best))}catch(e){}}
  h=`<div class="big ok">困り事、解決</div><div class="why">${m.ttl} ── MISSION COMPLETE</div><table><tr><td>タイム</td><td>${G.t.toFixed(1)} 秒</td></tr><tr><td>使用弾数</td><td>${G.shots} / ${G.maxShots}</td></tr><tr><td>ど真ん中ボーナス</td><td>${G.perfect?'+250':'─'}</td></tr><tr><td>SCORE</td><td>${sc}</td></tr></table><div class="rank">${rk}</div><div class="row">${MS[G.mi+1]?'<button class="go" id="r-next">次のファイル</button>':''}<button class="go alt" id="r-retry">リトライ</button><button class="go alt" id="r-menu">ファイル選択</button></div>`}
 else h=`<div class="big ng">${G.ttl||'MISSION FAILED'}</div><div class="why">${G.why}</div><div class="row"><button class="go" id="r-retry">リトライ</button><button class="go alt" id="r-menu">ファイル選択</button></div>`;
 $('#res').innerHTML=h;show('s-res');$('#hud').classList.add('on');const n=$('#r-next');if(n)n.onclick=()=>{show(null);startMission(G.mi+1)};$('#r-retry').onclick=()=>startMission(G.mi);$('#r-menu').onclick=toMenu}
/* ---------- per-frame ---------- */
const ecg=$('#ecg'),ex=ecg.getContext('2d');
function wave(p){if(p<.1)return .1*Math.sin(p/.1*Math.PI);if(p<.17)return 0;if(p<.2)return -.15*(p-.17)/.03;if(p<.24)return -.15+1.15*(p-.2)/.04;if(p<.28)return 1-1.3*(p-.24)/.04;if(p<.32)return -.3+.3*(p-.28)/.04;if(p<.5)return .22*Math.sin((p-.32)/.18*Math.PI);return 0}
function drawEcg(dt,ratio,col){G.ecT+=dt;const bpm=68+ratio*55+(G.holding?-8:0);G.ph=(G.ph||0)+dt*bpm/60;if(G.ph>1)G.ph-=1;if(G.ecT>1/30){G.ecT=0;G.ecg.push(wave(G.ph));if(G.ecg.length>150)G.ecg.shift()}
 ex.clearRect(0,0,300,84);ex.strokeStyle=col;ex.lineWidth=2.4;ex.shadowColor=col;ex.shadowBlur=6;ex.beginPath();G.ecg.forEach((v,i)=>{const x=i*2,y=66-v*52;i?ex.lineTo(x,y):ex.moveTo(x,y)});ex.stroke();ex.shadowBlur=0;return bpm}
let last=performance.now(),gc=0;const gx=$('#grain').getContext('2d'),gi=gx.createImageData(200,200);
function update(dt){const m=MS[G.mi],d=dt*G.ts;G.rt+=dt;if(!G.over){G.t+=dt;if(G.t>=G.limit)lose('MISSION FAILED',W.failText)}else{G.endT+=dt;if(G.ok){G.ts=G.endT<1.5?.2:Math.min(1,G.ts+dt*.8)}else G.ts=1;if(G.mode==='play'&&G.endT>(G.ok?3.8:2.6))result()}
 if(G.cool>0)G.cool-=dt;if(G.lastShot&&!G.over&&G.rt>=G.outAt)lose('弾切れ','射撃許可の弾をすべて使い切った。解決できなかった。');
 W.t=(W.t||0)+d;
 for(const L of W.lights){if(L.flick>0){const k=1-L.flick*Math.max(0,Math.sin(G.rt*37+L.ph)*Math.sin(G.rt*11.3+L.ph*2));L.l.intensity=L.base*k;if(L.sp)L.sp.material.opacity=L.sb*k}}
 W.tick&&W.tick(d,G.rt);animPeople(d,G.rt);W.fx.update(d);
 /* aim */
 if(G.keys.ArrowLeft||G.keys.KeyA)G.yaw+=dt*.5*ZOOM[G.z].f/58;if(G.keys.ArrowRight||G.keys.KeyD)G.yaw-=dt*.5*ZOOM[G.z].f/58;if(G.keys.ArrowUp||G.keys.KeyW)G.pitch+=dt*.4*ZOOM[G.z].f/58;if(G.keys.ArrowDown||G.keys.KeyS)G.pitch-=dt*.4*ZOOM[G.z].f/58;
 if(G.auto&&W.focus){const f=W.focus(),p=W.cam.pos,dx=f.x-p.x,dy=f.y-p.y,dz=f.z-p.z;G.yaw=lerp(G.yaw,Math.atan2(-dx,-dz),Math.min(1,dt*3));G.pitch=lerp(G.pitch,Math.atan2(dy,Math.hypot(dx,dz)),Math.min(1,dt*3))}
 else{G.yaw=clamp(G.yaw,G.y0-G.yR,G.y0+G.yR);G.pitch=clamp(G.pitch,G.p0-G.pR,G.p0+G.pR)}
 const fv=G.auto?G.autoFov:ZOOM[G.z].f;cam.fov=lerp(cam.fov,fv,Math.min(1,dt*10));cam.updateProjectionMatrix();
 if(G.holding&&G.breath>0&&!G.over){G.breath=Math.max(0,G.breath-dt/4.5);if(G.breath<=0){G.holding=false;G.gasp=1.3;$('#b-hold').classList.remove('dn')}}else G.breath=Math.min(1,G.breath+dt/6.5);if(G.gasp>0)G.gasp-=dt;
 const ratio=clamp(G.t/G.limit,0,1),stress=1+Math.max(0,ratio-.5)*1.2+(W.tense||0),calm=G.holding?.12:(G.gasp>0?1.9:1),amp=.0017*stress*calm*(W.swayK||1),tt=performance.now()/1000;
 G.sx=(Math.sin(tt*1.7)*.7+Math.sin(tt*3.1+1.3)*.4)*amp;G.sy=(Math.sin(tt*1.15+.6)*.8+Math.sin(tt*2.3)*.35)*amp*1.2;G.recoil*=Math.exp(-dt*5);
 if(G.auto){G.sx*=.2;G.sy*=.2}
 const sk=W.shk||0;cam.position.copy(W.cam.pos);cam.rotation.set(G.pitch+G.sy+G.recoil+Math.sin(tt*17.3)*sk+(W.bump||0),G.yaw+G.sx+Math.sin(tt*13.1+2)*sk,0);
 /* range */
 G.rngT-=dt;if(G.rngT<=0&&G.z>0&&!G.over){G.rngT=.15;cam.updateMatrixWorld(true);rc.setFromCamera({x:0,y:0},cam);const h=rc.intersectObjects(W.pick,false)[0];const wd=W.windX?` ／ 風 ${W.windX>0?'→':'←'}${Math.abs(W.windX).toFixed(1)}m/s`:'';$('#h-rng').textContent=`RNG ${h?String(Math.round(h.distance)).padStart(3,'0'):'---'} m ／ ×${ZOOM[G.z].m}${wd}`}
 /* hud */
 const left=Math.max(0,G.limit-G.t),col=ratio<.5?'#56c474':ratio<.8?'#e0a93b':'#d23a2c';const fill=$('#h-fill');fill.style.transform=`scaleX(${1-ratio})`;fill.style.background=col;$('#h-sec').textContent=left.toFixed(1);$('#h-sec').style.color=ratio>.8?'#d23a2c':'';
 const cc=G.ok?'#56c474':col,bpm=drawEcg(dt,G.ok?0:ratio,cc),ct=$('#cond-txt');ct.textContent=G.over&&!G.ok?'DOWN':ratio<.5?'FINE':ratio<.8?'CAUTION':'DANGER';ct.style.color=cc;
 const mk=$('#mark');if(!G.over&&G.rt>12&&G.shots<=1){cam.updateMatrixWorld(true);const p=W.target.getWorldPosition(_v).project(cam);if(p.z<1&&Math.abs(p.x)<1.05&&Math.abs(p.y)<1.05){mk.style.left=((p.x*.5+.5)*100)+'%';mk.style.top=((-p.y*.5+.5)*100)+'%';mk.classList.add('on')}else mk.classList.remove('on')}else mk.classList.remove('on');
 $('#h-breath i').style.transform=`scaleX(${G.breath})`;
 G.bt-=dt;if(!G.over&&(ratio>.55||W.tense||m.zone)&&G.bt<=0){G.bt=60/bpm;sfx.beat(m.zone?.4:.18)}
 if(m.zone&&!G.over)W.tense=.2;
 if(W.subs&&!G.over)W.subs.forEach(s=>{if(!s.done&&G.rt>=s[0]){s.done=true;say(s[1],s[2],s[3])}});if(G.subOff&&performance.now()>G.subOff){$('#sub').classList.remove('on');G.subOff=0}
}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused&&(G.mode==='play'||G.mode==='res')){update(dt);R.render(scene,cam)}
 if(++gc%3===0){const a=gi.data;for(let i=0;i<a.length;i+=4){const v=Math.random()*255;a[i]=a[i+1]=a[i+2]=v;a[i+3]=255}gx.putImageData(gi,0,0)}}
/* ---------- input ---------- */
const ptr=new Map();
cvs.addEventListener('pointerdown',e=>{if(G.mode!=='play'||paused)return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cvs.setPointerCapture(e.pointerId)}catch(_){}});
cvs.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p||G.mode!=='play'||paused||G.auto)return;const k=.0042*ZOOM[G.z].f/58*(window.innerHeight<500?1:1);G.yaw-=(e.clientX-p.x)*k;G.pitch-=(e.clientY-p.y)*k;p.x=e.clientX;p.y=e.clientY});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cvs.addEventListener(n,e=>ptr.delete(e.pointerId)));
cvs.addEventListener('wheel',e=>{if(G.mode!=='play'||paused)return;e.preventDefault();cycleZoom(e.deltaY<0?1:-1)},{passive:false});
const bf=$('#b-fire'),bh=$('#b-hold'),bz=$('#b-zoom');

bf.addEventListener('pointerdown',e=>{e.preventDefault();tapFx();fire()});bz.addEventListener('pointerdown',e=>{e.preventDefault();tapFx();cycleZoom()});
const hold=v=>{if(G.mode!=='play'||paused||G.over)return;G.holding=v&&G.breath>.05;bh.classList.toggle('dn',G.holding)};
bh.addEventListener('pointerdown',e=>{e.preventDefault();tapFx();bh.setPointerCapture(e.pointerId);hold(true)});['pointerup','pointercancel','lostpointercapture'].forEach(n=>bh.addEventListener(n,()=>hold(false)));
$('#b-menu').addEventListener('pointerdown',e=>{e.preventDefault();toMenu()});
addEventListener('keydown',e=>{if(e.code==='Escape'&&!e.repeat){togglePause();return}if(paused)return;G.keys&&(G.keys[e.code]=true);if(e.code==='Space'){e.preventDefault();fire()}else if(e.code==='KeyZ')cycleZoom();else if(e.code==='ShiftLeft'||e.code==='ShiftRight')hold(true)});
addEventListener('keyup',e=>{G.keys&&(G.keys[e.code]=false);if(e.code==='ShiftLeft'||e.code==='ShiftRight')hold(false)});
function clearInput(){ptr.clear();if(G.keys)G.keys={};G.holding=false;bh.classList.remove('dn')}
addEventListener('blur',()=>{clearInput();if(G.mode==='play')setPaused(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();if(G.mode==='play')setPaused(true);if(AC)AC.suspend()}else if(!paused&&AC&&AC.state==='suspended')audioInit()});
document.addEventListener('dblclick',e=>e.preventDefault());

const deck=document.createElement('section');deck.id='control-deck';deck.className='fc-control-deck';deck.setAttribute('aria-label','操作盤');
deck.innerHTML='<div id="deck-status"></div><div id="deck-system"><button id="pause-btn" type="button">一時停止</button><button id="mute-btn" type="button"></button></div><div id="deck-actions"></div>';
document.body.appendChild(deck);
['h-ammo','h-cond'].forEach(id=>$('#deck-status').appendChild($('#'+id)));
$('#deck-system').appendChild($('#b-menu'));
['b-zoom','b-hold','b-fire'].forEach(id=>$('#deck-actions').appendChild($('#'+id)));
function setPaused(value){paused=value;clearInput();$('#pause-screen').hidden=!paused;$('#pause-btn').textContent=paused?'再開':'一時停止';last=performance.now();if(AC){if(paused)AC.suspend();else audioInit()}}

buildMenu();fitViewport();requestAnimationFrame(loop);
